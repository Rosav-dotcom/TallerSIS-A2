# Revisa el frontend en cada push y Pull Request: instala, revisa con ESLint y compila.
# Si algo falla, GitHub lo marca en rojo antes de mezclar a main.
name: Frontend

on:
  push:
    branches: [main, migracion]
    paths: ['Frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['Frontend/**', '.github/workflows/frontend.yml']

jobs:
  lint-y-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
